<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdleAgent v0.4.0 - 通用挂机游戏Agent控制台</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">IA</div>
      <div class="logo-text">IdleAgent<span class="version-badge">v0.4.0</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard"><span class="nav-icon">&#9672;</span><span class="nav-label">仪表盘</span></a>
      <a href="#" class="nav-item" data-page="games"><span class="nav-icon">&#9673;</span><span class="nav-label">游戏管理</span><span class="badge">2</span></a>
      <a href="#" class="nav-item" data-page="rules"><span class="nav-icon">&#9678;</span><span class="nav-label">规则配置</span></a>
      <a href="#" class="nav-item" data-page="logs"><span class="nav-icon">&#9674;</span><span class="nav-label">决策日志</span><span class="badge new">12</span></a>
      <a href="#" class="nav-item" data-page="analytics"><span class="nav-icon">&#9680;</span><span class="nav-label">数据分析</span></a>
      <a href="#" class="nav-item" data-page="settings"><span class="nav-icon">&#9681;</span><span class="nav-label">系统设置</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="agent-status"><div class="status-dot running"></div><span>Agent运行中</span></div>
      <div class="version">v0.4.0</div>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">仪表盘</h1>
        <p class="page-subtitle">实时监控所有游戏Agent的运行状态</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" id="refreshBtn">刷新</button>
        <button class="btn btn-primary" id="addGameBtn">+ 添加游戏</button>
      </div>
    </header>
    <div class="content-area" id="contentArea"></div>
  </main>
</div>
<div class="modal" id="addGameModal">
  <div class="modal-backdrop"></div>
  <div class="modal-content">
    <div class="modal-header"><h3>添加新游戏</h3><button class="modal-close">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>游戏名称</label><input type="text" class="form-input" placeholder="例如: Melvor Idle"></div>
      <div class="form-group"><label>游戏URL</label><input type="text" class="form-input" placeholder="https://melvoridle.com"></div>
      <div class="form-group"><label>适配器类型</label>
        <select class="form-select">
          <option value="melvor">Melvor Idle (内置)</option>
          <option value="clicker">Clicker Heroes (社区)</option>
          <option value="ngu">NGU Idle (社区)</option>
          <option value="custom">自定义适配器</option>
        </select>
      </div>
      <div class="form-group"><label>运行模式</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="mode" value="auto" checked>全自动</label>
          <label class="radio-label"><input type="radio" name="mode" value="semi">半自动</label>
          <label class="radio-label"><input type="radio" name="mode" value="manual">手动</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelAddGame">取消</button>
      <button class="btn btn-primary" id="confirmAddGame">确认添加</button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
