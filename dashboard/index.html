<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdleAgent v0.8.1 - 通用挂机游戏Agent控制台</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<!-- ==================== 认证视图 ==================== -->
<div id="authView" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-icon">IA</div>
      <div>
        <div class="auth-title">IdleAgent</div>
        <div class="auth-subtitle">通用挂机游戏 Agent 控制台</div>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">登录</button>
      <button class="auth-tab" data-tab="register">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>用户名 / 邮箱</label>
        <input type="text" class="form-input" id="loginAccount" placeholder="请输入用户名或邮箱" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">登 录</button>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" class="auth-form hidden">
      <div class="form-group">
        <label>用户名 <span class="required">*</span></label>
        <input type="text" class="form-input" id="regUsername" placeholder="2-32 个字符" autocomplete="username">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input type="email" class="form-input" id="regEmail" placeholder="可选" autocomplete="email">
      </div>
      <div class="form-group">
        <label>昵称</label>
        <input type="text" class="form-input" id="regDisplayName" placeholder="可选，默认同用户名">
      </div>
      <div class="form-group">
        <label>密码 <span class="required">*</span></label>
        <input type="password" class="form-input" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>确认密码 <span class="required">*</span></label>
        <input type="password" class="form-input" id="regPassword2" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">注 册</button>
    </form>

    <div id="authError" class="auth-error hidden"></div>
  </div>
</div>

<!-- ==================== 应用视图 ==================== -->
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">IA</div>
      <div class="logo-text">IdleAgent<span class="version-badge">v0.8.1</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard"><span class="nav-icon">&#9672;</span><span class="nav-label">仪表盘</span></a>
      <a href="#" class="nav-item" data-page="melvor"><span class="nav-icon">&#9812;</span><span class="nav-label">梅尔沃放置</span></a>
      <a href="#" class="nav-item" data-page="profile"><span class="nav-icon">&#9733;</span><span class="nav-label">个人资料</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip" id="sidebarUser">
        <div class="avatar" id="sidebarAvatar">?</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="sidebarName">...</div>
          <div class="user-chip-mail" id="sidebarMail"></div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">仪表盘</h1>
        <p class="page-subtitle" id="pageSubtitle">实时监控游戏 Agent 运行状态</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" id="refreshBtn">刷新</button>
      </div>
    </header>
    <div class="content-area" id="contentArea"></div>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
